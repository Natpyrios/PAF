<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" name="theme-color" content="#06080f"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="https://i.imgur.com/uPiIzGJ.png">
    <script src="lazyload.js?v=20260528"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'paf-bg': '#06080f',
              'paf-surface': '#0f1320',
              'paf-accent': '#fbbf24',
            },
            fontFamily: {
              sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
            },
          }
        }
      }
    </script>
    <link rel="stylesheet" href="css/styles.css?v=20260528">
    <title>PAF</title>
</head>

<body class="min-h-screen text-slate-200 font-sans">

<div class="kreska fixed top-0 left-0 z-[999] w-full h-0.5"></div>

<div class="fixed top-0.5 left-0 z-[997] w-full h-[60px] bg-black/85 backdrop-blur-md border-b border-teal-500/10 text-center">
    <div class="inline-block m-1">
        <img src="https://i.imgur.com/RBkZCAb.png" width="107" height="50">
    </div>
    <select id="sort"
            title="Sortuj listę"
            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-200 border border-white/10 rounded-lg pl-3 py-1 text-xs">
        <option value="sheet">Kolejność z arkusza</option>
        <option value="name-asc">Nazwa A-Z</option>
        <option value="name-desc">Nazwa Z-A</option>
        <option value="rating-desc">Ocena najwyższa</option>
        <option value="rating-asc-rated">Gówna totalne</option>
        <option value="date-desc">Data najnowsza</option>
        <option value="date-asc">Data najstarsza</option>
        <option value="length-desc">Długość najdłuższa</option>
    </select>
</div>

<div class="fixed top-[62px] left-0 z-[997] w-full h-[45px] bg-black/85 backdrop-blur-md border-b border-white/5 flex items-center justify-center px-3 md:px-0">
    <div class="relative flex-1 max-w-[440px] md:flex-none md:max-w-none">
        <form action="" onsubmit="return false">
            <input id="myInput" type="text" autocomplete="off"
                   placeholder='Szukaj... lub "tag:Komedia"'
                   title='Wpisz fragment tytułu, lub prefiks "tag:" by szukać po tagach (np. tag:Komedia)'
                   class="text-slate-200 border border-white/10 rounded-lg pl-3.5 pr-14 py-2 text-center w-full md:w-[440px]">
        </form>
        <button id="myClear" type="button" title="Wyczyść" aria-label="Wyczyść"
                class="hidden absolute right-9 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-100 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="w-4 h-4">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25Zm-1.72 6.97a.75.75 0 1 0-1.06 1.06L10.94 12l-1.72 1.72a.75.75 0 1 0 1.06 1.06L12 13.06l1.72 1.72a.75.75 0 1 0 1.06-1.06L13.06 12l1.72-1.72a.75.75 0 1 0-1.06-1.06L12 10.94l-1.72-1.72Z"/>
            </svg>
        </button>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
             class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
        </svg>
    </div>
</div>

<div id="filtry" class="md:fixed md:left-0 md:top-[115px] md:bottom-2 mt-[115px] md:mt-0 w-full md:w-[150px] md:z-[996] px-3 pb-2 md:py-3 md:px-2 flex flex-col gap-1 md:overflow-y-auto"></div>

<div id="container" class="flex flex-row flex-wrap pt-2 md:pt-[110px] pl-2 md:pl-[170px] justify-center md:justify-start"></div>

<div class="w-full h-[300px] bg-gradient-to-b from-[#0a0e1a] to-paf-bg border-t border-teal-500/15 text-slate-400 flex">
    <div class="w-1/2 flex items-center justify-center">
        <img src="https://i.imgur.com/CVgaZX1.png" width="290" height="290">
    </div>
    <div class="w-1/2 flex items-center justify-center">
        <div class="text-center">
            <h2 class="text-2xl">Projekt PAF</h2>
            <img src="https://i.imgur.com/u2oXe0D.png" width="80" height="40" class="mx-auto my-2">
            PPE, 2024
        </div>
    </div>
</div>

<button id="myBtn" title="Powrót na górę" aria-label="Powrót na górę"
        class="btn-primary fixed bottom-6 right-6 z-[997] w-12 h-12 rounded-full flex items-center justify-center text-white">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"
         class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 19.5v-15m0 0-6.75 6.75M12 4.5l6.75 6.75"/>
    </svg>
</button>

<div id="paf-modal" class="paf-modal" aria-hidden="true">
    <div class="paf-modal-card"></div>
</div>

<script src="script.js?v=20260528"></script>
</body>
</html>
